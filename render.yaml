services:
  # ── API (Hono + Bun) ─────────────────────────────────────────────────────
  - type: web
    name: stackly-api
    runtime: node
    buildCommand: "curl -fsSL https://bun.sh/install | bash && export PATH=\"$HOME/.bun/bin:$PATH\" && bun install"
    startCommand: "bash start-server.sh"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: CORS_ORIGIN
        value: https://stackly-web.onrender.com
      - key: DATABASE_URL
        value: /opt/render/project/src/stackly.db
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true

  # ── Web (Vite static) ─────────────────────────────────────────────────────
  - type: web
    name: stackly-web
    runtime: static
    buildCommand: "curl -fsSL https://bun.sh/install | bash && export PATH=\"$HOME/.bun/bin:$PATH\" && bun install && bunx vite build"
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://stackly-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
