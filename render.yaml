services:
  # ── API (Hono + Bun + SQLite) ─────────────────────────────────────────────
  - type: web
    name: stackly-api
    runtime: node
    plan: free
    buildCommand: npm install -g bun@1.3.14 && bun install --no-frozen-lockfile
    startCommand: bun server/index.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      # Set these in the Render dashboard — do NOT put real values here:
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false

  # ── Web (Vite static build) ───────────────────────────────────────────────
  - type: web
    name: stackly-web
    runtime: static
    buildCommand: npm install -g bun@1.3.14 && bun install --no-frozen-lockfile && bunx vite build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
