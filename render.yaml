services:
  # ── API (Hono + Bun) ─────────────────────────────────────────────────────
  - type: web
    name: stackly-api
    runtime: node
    buildCommand: >
      curl -fsSL https://bun.sh/install | bash &&
      $HOME/.bun/bin/bun install &&
      echo "BUN_PATH=$HOME/.bun/bin/bun" >> $RENDER_BUILD_VARS 2>/dev/null || true
    startCommand: "$HOME/.bun/bin/bun server/index.ts"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: CORS_ORIGIN
        value: https://stackly-web.onrender.com
      - key: DATABASE_URL
        value: /opt/render/project/src/stackly.db
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DEMO_MODE
        value: "true"

  # ── Web (Vite static) ─────────────────────────────────────────────────────
  - type: web
    name: stackly-web
    runtime: static
    buildCommand: >
      curl -fsSL https://bun.sh/install | bash &&
      $HOME/.bun/bin/bun install &&
      $HOME/.bun/bin/bunx vite build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://stackly-a1ke.onrender.com
      - key: VITE_DEMO_MODE
        value: "true"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
