services:
  # ── Stackly: API + frontend served from one Hono process ─────────────────
  # No separate static site — Hono serves dist/ directly.
  # This eliminates all SPA rewrite-rule issues on Render.
  - type: web
    name: stackly-api
    runtime: node
    buildCommand: >
      curl -fsSL https://bun.sh/install | bash &&
      $HOME/.bun/bin/bun install &&
      VITE_API_URL="" VITE_DEMO_MODE=true $HOME/.bun/bin/bunx vite build
    startCommand: "$HOME/.bun/bin/bun server/index.ts"
    # Persistent disk — keeps stackly.db alive across deploys ($1/month on Render)
    disk:
      name: stackly-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: DATABASE_URL
        value: /data/stackly.db
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DEMO_MODE
        value: "true"
