<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#3a9460"/>
      <stop offset="100%" stop-color="#1f5c38"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle glow circle -->
  <circle cx="600" cy="255" r="220" fill="rgba(255,255,255,0.06)"/>

  <!-- Sprout emoji rendered as SVG paths (stylised) -->
  <!-- Stem -->
  <path d="M600 420 Q600 340 600 280" stroke="#4ade80" stroke-width="18" stroke-linecap="round" fill="none"/>
  <!-- Left leaf -->
  <path d="M600 340 Q540 290 510 250 Q560 255 600 310" fill="#4ade80"/>
  <!-- Right leaf -->
  <path d="M600 300 Q660 250 700 215 Q650 235 600 280" fill="#6ee7a0"/>
  <!-- Soil mound -->
  <ellipse cx="600" cy="425" rx="80" ry="18" fill="#166534"/>

  <!-- Stackly wordmark -->
  <text x="600" y="520" font-family="Georgia, serif" font-size="100" font-weight="bold"
        text-anchor="middle" fill="#ffffff" letter-spacing="-2">Stackly</text>

  <!-- Tagline -->
  <text x="600" y="582" font-family="Arial, sans-serif" font-size="36"
        text-anchor="middle" fill="rgba(255,255,255,0.72)" letter-spacing="1">Money school for kids</text>
</svg>
